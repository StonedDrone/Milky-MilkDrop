<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MilkDrop Alchemy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
              display: ['Orbitron', 'sans-serif'],
            },
            colors: {
              'brand-purple': '#8A2BE2',
              'brand-cyan': '#00FFFF',
              'brand-pink': '#FF00FF',
            },
            animation: {
              'pulse-glow': 'pulse-glow 3s ease-in-out infinite',
            },
            keyframes: {
              'pulse-glow': {
                '0%, 100%': { 'box-shadow': '0 0 5px #00FFFF, 0 0 10px #00FFFF, 0 0 15px #FF00FF, 0 0 20px #FF00FF' },
                '50%': { 'box-shadow': '0 0 10px #FF00FF, 0 0 15px #FF00FF, 0 0 20px #8A2BE2, 0 0 25px #8A2BE2' },
              }
            }
          }
        }
      }
    </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.1.1",

    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.21.0"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
